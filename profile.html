{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block page_heading %}My profile{% endblock %}
{% block content %}<div class="page-intro"><span class="pill">ACCOUNT SETTINGS</span><h1>Your <em>profile.</em></h1><p class="muted">Keep your contact details up to date.</p></div><form class="panel compact-form profile-form" method="post"><label>Full name</label><input name="name" value="{{ user.name }}" required><label>Email address</label><input value="{{ user.email }}" disabled><label>Phone number</label><input name="phone" value="{{ user.phone }}"><label>Address</label><textarea name="address" required>{{ user.address }}</textarea><button class="btn btn-primary">Save changes →</button></form>{% endblock %}
