{% extends "base.html" %}{% block title %}New pickup{% endblock %}{% block page_heading %}Request a pickup{% endblock %}
{% block content %}<div class="page-intro"><span class="pill">COLLECTION REQUEST</span><h1>Schedule a <em>pickup.</em></h1><p class="muted">Tell us what needs collecting and where. Our team will take it from there.</p></div><form class="panel request-form" method="post"><div class="form-grid"><div><label>Waste category *</label><select name="category" required>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div><div><label>Estimated quantity (kg) *</label><input type="number" name="quantity" min="0.1" step="0.1" placeholder="e.g. 5" required></div><div class="span-two"><label>Collection address *</label><textarea name="address" placeholder="Enter full pickup address" required></textarea></div><div><label>Preferred collection date *</label><input type="date" name="preferred_date" min="{{ '2026-01-01' }}" required></div><div><label>Additional notes</label><input name="notes" placeholder="Landmark, access instructions..."></div></div><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('pickups') }}">Cancel</a><button class="btn btn-primary">Submit request →</button></div></form>{% endblock %}
